group: Models - Multimodal
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) Multimodal Models (Standard) 1: qwen2"
  key: multi-modal-models-standard-1-qwen2
  automatic_shard: true
  timeout_in_minutes: 68
  device: h200_18gb
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/multimodal
  commands:
    - pytest -v -s models/multimodal/generation/test_common.py -m core_model -k "qwen2"
    - pytest -v -s models/multimodal/generation/test_ultravox.py -m core_model
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Multimodal Models (Standard) 1: qwen2"
      dind: false
      automatic_shard: true
      device: mi355_dpx
      timeout_in_minutes: 65
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 18GB) Multimodal Models (Standard) 2: qwen3 + gemma"
  key: multi-modal-models-standard-2-qwen3-gemma
  automatic_shard: true
  timeout_in_minutes: 75
  device: h200_18gb
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/multimodal
  commands:
    - pytest -v -s models/multimodal/generation/test_common.py -m core_model -k "qwen3 or gemma"
    - pytest -v -s models/multimodal/generation/test_mm_prefix_lm.py -m core_model
    - pytest -v -s models/multimodal/generation/test_qwen2_5_vl.py -m core_model
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Multimodal Models (Standard) 2: qwen3 + gemma"
      automatic_shard: true
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 55
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) Multimodal Models (Standard) 3: llava + qwen2_vl"
  device: h200_35gb
  key: multi-modal-models-standard-3-llava-qwen2-vl
  automatic_shard: true
  timeout_in_minutes: 40
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/multimodal
  commands:
    - pytest -v -s models/multimodal/generation/test_common.py -m core_model -k "not qwen2 and not qwen3 and not gemma"
    - pytest -v -s models/multimodal/generation/test_qwen2_vl.py -m core_model
  mirror:
    amd:
      automatic_shard: true
      label: ":amd: (MI250) Multimodal Models (Standard) 3: llava + qwen2_vl"
      dind: false
      device: mi250_1
      timeout_in_minutes: 55
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) Unlimited-OCR-2"
  device: h200_35gb
  key: unlimited-ocr2-generation
  automatic_shard: true
  timeout_in_minutes: 30
  source_file_dependencies:
  - vllm/
  - examples/generate/multimodal/vision_language_multi_image_offline.py
  - tests/models/multimodal/generation/test_unlimited_ocr.py
  - tests/models/multimodal/processing/test_unlimited_ocr.py
  commands:
    - pytest -v -s models/multimodal/generation/test_unlimited_ocr.py -m core_model
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Unlimited-OCR-2"
      device: mi355_dpx
      dind: false
      timeout_in_minutes: 30
      depends_on:
      - image-build-amd
      commands:
      - >-
        pytest -v -s models/multimodal/generation/test_unlimited_ocr.py
        -m core_model
      - >-
        pytest -v -s models/multimodal/processing/test_unlimited_ocr.py

- label: ":nvidia: (H200 MIG 35GB) Multimodal Models (Standard) 4: other + whisper"
  device: h200_35gb
  key: multi-modal-models-standard-4-other-whisper
  automatic_shard: true
  timeout_in_minutes: 75
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/multimodal
  commands:
    - >-
      pytest -v -s
      models/multimodal
      -m core_model
      --ignore models/multimodal/generation/test_common.py
      --ignore models/multimodal/generation/test_ultravox.py
      --ignore models/multimodal/generation/test_unlimited_ocr.py
      --ignore models/multimodal/generation/test_qwen2_5_vl.py
      --ignore models/multimodal/generation/test_qwen2_vl.py
      --ignore models/multimodal/generation/test_whisper.py
      --ignore models/multimodal/generation/test_mm_prefix_lm.py
      --ignore models/multimodal/generation/test_memory_leak.py
      --ignore models/multimodal/generation/test_vit_cudagraph.py
      --ignore models/multimodal/processing
    - pytest -v -s models/multimodal/generation/test_vit_cudagraph.py -m core_model
    - pytest models/multimodal/generation/test_memory_leak.py -m core_model
    - pytest -v -s models/multimodal/generation/test_whisper.py -m core_model
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Multimodal Models (Standard) 4: other + whisper"
      automatic_shard: true
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 70
      depends_on:
      - image-build-amd

- label: ":computer: (CPU) Multimodal Processor Shard %N"
  key: multi-modal-processor-cpu
  depends_on:
  - image-build-cpu
  timeout_in_minutes: 125
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/multimodal
  - tests/models/registry.py
  - tests/transformers_utils/processors/test_cosmos3_cvcuda.py
  - tests/transformers_utils/processors/test_cosmos3_edge_cvcuda.py
  - tests/transformers_utils/processors/test_cvcuda_resize.py
  device: cpu-medium
  commands:
    - >-
      pytest -v -s
      models/multimodal/processing
      transformers_utils/processors/test_cosmos3_cvcuda.py
      transformers_utils/processors/test_cosmos3_edge_cvcuda.py
      transformers_utils/processors/test_cvcuda_resize.py
      --deselect transformers_utils/processors/test_cvcuda_resize.py::test_gpu_forced_tiling_is_exact_v2_for_cpu_and_cuda_inputs
      --deselect transformers_utils/processors/test_cosmos3_cvcuda.py::test_gpu_patchify_matches_stock_uint8
      --deselect transformers_utils/processors/test_cosmos3_cvcuda.py::test_native_apply_preserves_raw_videos_and_stock_prompt_contract
      --deselect transformers_utils/processors/test_cosmos3_cvcuda.py::test_gpu_public_resize_preserves_pixels_and_stream_lifetime
      --deselect transformers_utils/processors/test_cosmos3_edge_cvcuda.py::test_gpu_edge_patchify_matches_stock_uint8
      --ignore models/multimodal/processing/test_tensor_schema.py
      --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB
  parallelism: 4

- label: ":nvidia: (H200 MIG 18GB) Multimodal Processor"
  key: multi-modal-processor
  automatic_shard: true
  timeout_in_minutes: 98
  device: h200_18gb
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/multimodal
  - tests/models/registry.py
  - tests/transformers_utils/processors/test_cosmos3_cvcuda.py
  - tests/transformers_utils/processors/test_cosmos3_edge_cvcuda.py
  - tests/transformers_utils/processors/test_cvcuda_resize.py
  commands:
    - pytest -v -s models/multimodal/processing/test_tensor_schema.py
    - |
      set -eu
      ci_env_dir=$$(mktemp -d)
      trap 'rm -rf "$$ci_env_dir"' EXIT
      uv venv --system-site-packages "$$ci_env_dir/.venv"
      ci_python="$$ci_env_dir/.venv/bin/python"
      cuda_major=$$("$$ci_python" -c 'import torch; print(torch.version.cuda.split(".")[0])')
      case "$$cuda_major" in
        12|13) uv pip install --python "$$ci_python" "cvcuda-cu$$cuda_major==0.19.0" ;;
        *) echo "Unsupported CUDA major: $$cuda_major"; exit 1 ;;
      esac
      "$$ci_python" -m pytest -v -s \
      transformers_utils/processors/test_cosmos3_cvcuda.py::test_gpu_patchify_matches_stock_uint8 \
      transformers_utils/processors/test_cosmos3_cvcuda.py::test_native_apply_preserves_raw_videos_and_stock_prompt_contract \
      transformers_utils/processors/test_cosmos3_cvcuda.py::test_gpu_public_resize_preserves_pixels_and_stream_lifetime \
      transformers_utils/processors/test_cosmos3_edge_cvcuda.py::test_gpu_edge_patchify_matches_stock_uint8
      "$$ci_python" -m pytest -v -s \
      transformers_utils/processors/test_cvcuda_resize.py::test_gpu_forced_tiling_is_exact_v2_for_cpu_and_cuda_inputs
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Multimodal Processor"
      automatic_shard: true
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 115
      depends_on:
      - image-build-amd
      commands:
      - pytest -v -s models/multimodal/processing/test_tensor_schema.py
      - pytest -v -s models/multimodal/processing/test_mistral3.py::test_pixtral_patch_embed_preserves_image_order_and_strides models/multimodal/test_mimo_v2_omni.py

- label: ":nvidia: (H200 MIG 35GB) Multimodal Accuracy Eval (Small Models)"
  device: h200_35gb
  key: multi-modal-accuracy-eval-small-models
  automatic_shard: true
  timeout_in_minutes: 30
  working_dir: "/vllm-workspace/.buildkite/lm-eval-harness"
  source_file_dependencies:
  - vllm/multimodal/
  - vllm/inputs/
  - vllm/v1/core/
  commands:
  - pytest -s -v test_lm_eval_correctness.py --config-list-file=configs/models-mm-small.txt --tp-size=1
  mirror:
    amd:
      automatic_shard: true
      label: ":amd: (MI355 DPX) Multimodal Accuracy Eval (Small Models)"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 35
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/multimodal/
      - vllm/inputs/
      - vllm/v1/core/
      - vllm/platforms/rocm.py
      - vllm/model_executor/model_loader/

- label: ":nvidia: (B200) [Nightly] Multimodal FlashInfer Autotuning"
  key: multi-modal-flashinfer-autotuning
  device: b200-k8s
  num_devices: 2
  timeout_in_minutes: 30
  optional: true
  env:
    VLLM_WORKER_MULTIPROC_METHOD: spawn
  source_file_dependencies:
  - vllm/config/kernel.py
  - vllm/config/multimodal.py
  - vllm/model_executor/warmup/
  - vllm/model_executor/kernels/linear/nvfp4/
  - vllm/model_executor/kernels/linear/mxfp8/
  - vllm/model_executor/layers/quantization/online/
  - vllm/multimodal/encoder_budget.py
  - vllm/model_executor/models/pixtral.py
  - vllm/model_executor/models/qwen2_5_vl.py
  - vllm/model_executor/models/vision.py
  - vllm/utils/flashinfer.py
  - vllm/v1/core/encoder_cache_manager.py
  - vllm/v1/worker/gpu/
  - tests/model_executor/test_flashinfer_encoder_autotune.py
  commands:
    - pytest -v -s model_executor/test_flashinfer_encoder_autotune.py

- label: ":nvidia: (H200 MIG 35GB) [Nightly] Multimodal Models (Extended Generation 1)"
  device: h200_35gb
  key: multi-modal-models-extended-generation-1
  automatic_shard: true
  optional: true
  env:
    # Engines in a shard can start after other tests touched CUDA in the
    # pytest process, so never fork them.
    VLLM_WORKER_MULTIPROC_METHOD: spawn
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/multimodal/generation
  - tests/models/multimodal/test_mapping.py
  commands:
    - >-
      pytest -v -s
      models/multimodal/generation
      -m 'not core_model'
      --ignore models/multimodal/generation/test_common.py
    - pytest -v -s models/multimodal/test_mapping.py
  mirror:
    amd:
      automatic_shard: true
      label: ":amd: (MI355 DPX) Multimodal Models (Extended Generation 1)"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 100
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) [Nightly] Multimodal Models (PPL)"
